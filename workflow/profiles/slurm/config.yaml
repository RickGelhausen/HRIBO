# SLURM profile for HRIBO.
#
# Requires snakemake-executor-plugin-slurm in the Snakemake environment:
#     conda install -c conda-forge -c bioconda snakemake-executor-plugin-slurm
#
# Per-rule memory, runtime and thread requirements are declared on the rules
# themselves, so they stay correct when rules are renamed. Only cluster-specific
# settings belong here. Override an individual rule on the command line with
# --set-resources or --set-threads rather than editing this file.

executor: slurm

software-deployment-method:
  - conda
  - apptainer

default-resources:
  slurm_account: "YOUR_ACCOUNT"     # sacctmgr show user $USER accounts
  slurm_partition: "base"
  mem_mb: 10000
  runtime: 60
  nodes: 1

jobs: 50
latency-wait: 200
keep-going: True

# Reparation is memory hungry and does not parallelise across instances well.
resources:
  reparation_instances: 1
