$schema: "https://json-schema.org/draft/2020-12/schema"
description: HRIBO workflow configuration

type: object
required:
  - biologySettings
  - differentialExpressionSettings
  - predictionSettings
  - readstatSettings
  - metageneSettings
  - tisAdvisorSettings
  - workflowSettings
additionalProperties: true

$defs:
  onOff:
    type: string
    pattern: "^([Oo][Nn]|[Oo][Ff][Ff])$"
    description: either "on" or "off"

  adapter:
    type: string
    pattern: "^ *$|^ *[ACGTUNRYSWKMBDHVacgtunryswkmbdhv]+ *(, *[ACGTUNRYSWKMBDHVacgtunryswkmbdhv]+ *)*$"
    description: empty, or a comma-separated list of nucleotide sequences with optional surrounding spaces

  stageName:
    type: string
    enum:
      - trimming
      - mapping
      - qc
      - tracks
      - genome_tracks
      - readcounts
      - metagene
      - tis_advisor
      - correlation
      - pca
      - predictions
      - differential_expression
      - overview
    description: One part of the pipeline, as listed in config/config.yaml.

  stageSelection:
    description: >
      Which parts of the pipeline to run: a preset name ("full",
      "preprocessing"), a comma-separated list of stage names, or a list of
      stage names. Unknown names are rejected by lib/stages.py with the full
      list of what is accepted.
    oneOf:
      - type: string
        pattern: "^[a-z_]+(,[a-z_]+)*$"
      - type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: "#/$defs/stageName"}

  readLengthSpec:
    type: string
    minLength: 1
    pattern: "^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$"
    description: >
      Comma-separated read lengths, where a "-" denotes an inclusive interval,
      for example "22,23,27,34-35" or "25-34".

properties:

  stages:
    $ref: "#/$defs/stageSelection"
    description: >
      Overrides workflowSettings.stages for a single run, set from the command
      line as `--config stages=mapping,tracks`.

  biologySettings:
    type: object
    required:
      - adapterS3
      - adapterS5
      - adapterP3R1
      - adapterP5R1
      - adapterP3R2
      - adapterP5R2
      - genome
      - annotation
      - samples
      - alternativeStartCodons
    additionalProperties: false
    properties:
      adapterS3: {$ref: "#/$defs/adapter"}
      adapterS5: {$ref: "#/$defs/adapter"}
      adapterP3R1: {$ref: "#/$defs/adapter"}
      adapterP5R1: {$ref: "#/$defs/adapter"}
      adapterP3R2: {$ref: "#/$defs/adapter"}
      adapterP5R2: {$ref: "#/$defs/adapter"}
      genome:
        type: string
        minLength: 1
        description: Path to the reference genome FASTA.
      annotation:
        type: string
        minLength: 1
        description: Path to the reference annotation in GFF3 or GTF format.
      samples:
        type: string
        minLength: 1
        description: Path to the tab-separated sample sheet.
      alternativeStartCodons:
        type: array
        items:
          type: string
          pattern: "^[ATGCatgc]{3}$"
        description: Three-letter alternative start codons, for example ["GTG", "TTG"].

  differentialExpressionSettings:
    type: object
    required:
      - features
      - contrasts
      - padjCutoff
      - log2fcCutoff
    additionalProperties: false
    properties:
      features:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
        description: Annotation feature types counted for differential expression.
      contrasts:
        type: array
        items:
          type: string
          pattern: "^[A-Za-z0-9]+-[A-Za-z0-9]+$"
        description: >
          Condition contrasts as "treated-untreated". Left empty, every pairwise
          combination of conditions is used.
      padjCutoff:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 1
      log2fcCutoff:
        type: number
        minimum: 0
        description: >
          Applied as >= log2fcCutoff for upregulated and <= -log2fcCutoff for
          downregulated features, so it is given as a non-negative number.
      xtailBins:
        type: integer
        minimum: 1
        default: 10000
        description: >
          Number of probability-density bins used by xTail. Larger values
          improve p-value accuracy at the cost of runtime.
      xtailMinMeanCount:
        type: number
        minimum: 1
        default: 1
        description: >
          Minimum mean RNA and RPF count retained by xTail. The default keeps
          the historical HRIBO/xTail 1.1.5 threshold rather than silently
          adopting xTail 1.2.0's higher default of 10.

  predictionSettings:
    type: object
    required: [deepribo, deepriboASiteOffset]
    additionalProperties: false
    properties:
      deepribo: {$ref: "#/$defs/onOff"}
      deepriboASiteOffset:
        type: integer
        minimum: 0
        maximum: 30
        description: >
          Distance from the 3' end of a read to the ribosomal A-site. DeepRibo's
          published value of 12 is E. coli derived and may not transfer to other
          organisms or digestion protocols.

  readstatSettings:
    type: object
    required: [readLengths]
    additionalProperties: false
    properties:
      readLengths: {$ref: "#/$defs/readLengthSpec"}

  metageneSettings:
    type: object
    required:
      - positionsOutsideORF
      - positionsInORF
      - filteringMethods
      - neighboringGenesDistance
      - rpkmThreshold
      - lengthCutoff
      - mappingMethods
      - readLengths
      - normalizationMethods
      - outputFormats
      - includePlotlyJS
      - colorList
    additionalProperties: false
    properties:
      positionsOutsideORF:
        type: integer
        minimum: 0
      positionsInORF:
        type: integer
        minimum: 1
      filteringMethods:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [overlap, length, rpkm]
      neighboringGenesDistance:
        type: integer
        minimum: 0
      rpkmThreshold:
        type: number
        minimum: 0
      lengthCutoff:
        type: integer
        minimum: 0
      mappingMethods:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [fiveprime, threeprime, centered, global]
      readLengths: {$ref: "#/$defs/readLengthSpec"}
      normalizationMethods:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [raw, cpm, window]
      outputFormats:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [interactive, svg, pdf, png, jpg]
      includePlotlyJS:
        type: string
        enum: [integrated, online, local]
      colorList:
        type: array
        items:
          type: string
        description: >
          Optional per-read-length plot colours, assigned in read-length order.
          Short lists cycle; left empty, the colour-blind-friendly theme palette
          is used.

  tisAdvisorSettings:
    type: object
    required: [readLengths, mappingMethods]
    additionalProperties: false
    properties:
      readLengths: {$ref: "#/$defs/readLengthSpec"}
      mappingMethods:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [fiveprime, threeprime]
        description: >
          Read ends to evaluate. Listing both lets the advisor pick whichever the
          protocol defines more precisely.

  workflowSettings:
    type: object
    required: [stages]
    additionalProperties: false
    properties:
      stages: {$ref: "#/$defs/stageSelection"}
