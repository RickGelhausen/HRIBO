channels:
 - conda-forge
 - bioconda
dependencies:
  # Bioconda's current rebuild targets the R 4.4 series. Its upstream 2.4.0
  # tag still reports internal package metadata version 2.3.4; the value below
  # is the published Conda artifact version, not R's packageVersion() result.
 - r-base =4.4
 - r-riborex =2.4.0
 - r-optparse
