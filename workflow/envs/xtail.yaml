channels:
 - conda-forge
 - bioconda
dependencies:
 # xtail 1.1.5 is the only release on bioconda, but it has builds for several R
 # versions. r40 is the newest of them, so this is as current as xtail gets.
 # r-optparse and r-plyr are left unpinned so that conda can pick builds
 # compatible with R 4.0.
 - r-base =4.0
 - xtail =1.1.5
 - r-optparse
 - r-plyr
 - libgfortran-ng
