channels:
 - conda-forge
 - bioconda
 - nodefaults
dependencies:
 # Bioconda only packages the R-4-incompatible xTail 1.1.5. Declare the
 # official 1.2.0 source release's dependencies directly; the adjacent
 # checksum-pinned post-deploy script installs that release once this modern
 # environment has been created.
 - r-base =4.4
 - bioconductor-deseq2
 - bioconductor-s4vectors
 - bioconductor-biocgenerics
 - bioconductor-biocstyle
 - bioconductor-summarizedexperiment
 - r-rcpp
 - r-rcpparmadillo
 - r-matrixstats
 - r-locfit
 - r-ggplot2
 - r-optparse
 - cxx-compiler
 - make
 - curl
 - coreutils
 - libgfortran-ng
