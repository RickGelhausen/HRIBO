name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create development environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.linux-64.pin.txt
          environment-name: hribo-dev
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Cache Snakemake production environments
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environment*.yaml', 'environment*.linux-64.pin.txt', 'workflow/envs/*.yaml', 'workflow/envs/*.linux-64.pin.txt', 'workflow/envs/*.post-deploy.sh', 'workflow/conda-lock/virtual-packages.yml') }}

      - name: Verify test toolchain
        run: |
          python --version
          snakemake --version
          conda-lock --version
          pytest --version
          ruff --version
          shellcheck --version
          gt -version
          Rscript --version
          python -c "import Bio, interlap, numpy, openpyxl, pandas, plotly, pysam, xlsxwriter, yaml"

      - name: Validate YAML, config, and sample schemas
        run: |
          yamllint -c .yamllint.yaml \
            environment.yaml environment-dev.yaml .readthedocs.yaml CITATION.cff config \
            workflow/conda-lock workflow/envs workflow/schemas .github/workflows
          python .github/scripts/check_config.py
          python .github/scripts/check_conda_pins.py

      - name: Lint maintained Python scope
        run: ruff check .github/scripts tests workflow/scripts

      - name: Check shell and R syntax
        run: |
          mapfile -t shell_files < <(find . workflow/scripts workflow/envs -maxdepth 2 -type f -name '*.sh' -print)
          bash -n "${shell_files[@]}"
          shellcheck "${shell_files[@]}"

          mapfile -t r_files < <(find workflow/scripts -maxdepth 1 -type f -name '*.R' -print)
          for r_file in "${r_files[@]}"; do
            Rscript -e 'parse(file=commandArgs(trailingOnly=TRUE)[1])' "$r_file"
          done

      - name: Run complete Python test suite
        env:
          HRIBO_TEST_CONDA_PREFIX: ${{ github.workspace }}/.snakemake/conda
        run: |
          mkdir -p .ci-results
          pytest -q --junitxml=.ci-results/pytest.xml
          python .github/scripts/assert_no_pytest_skips.py \
            .ci-results/pytest.xml --expected-tests 759

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -n -b html docs docs/_build/html

  deltate-container-smoke:
    name: DeltaTE production container smoke
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create development environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.linux-64.pin.txt
          environment-name: hribo-dev
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Install checksum-verified Apptainer
        env:
          APPTAINER_DEB_SHA256: 82b0bdddf459087d202383360b8318d526ad6826c748a2f669913cc6aef9ee40
          APPTAINER_DEB_URL: https://github.com/apptainer/apptainer/releases/download/v1.5.3/apptainer_1.5.3_amd64.deb
        run: |
          test "$(dpkg --print-architecture)" = amd64
          package="${RUNNER_TEMP}/apptainer_1.5.3_amd64.deb"
          curl --fail --location --retry 5 --show-error \
            --output "$package" "$APPTAINER_DEB_URL"
          printf '%s  %s\n' "$APPTAINER_DEB_SHA256" "$package" \
            | sha256sum --check --strict
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes "$package" poppler-utils
          test "$(apptainer version)" = 1.5.3

      - name: Cache DeltaTE adapter environment
        uses: actions/cache@v4
        with:
          path: .snakemake/ci-deltate-conda
          key: deltate-conda-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environment-dev.linux-64.pin.txt', 'workflow/envs/excel.yaml', 'workflow/envs/excel.linux-64.pin.txt', 'workflow/conda-lock/virtual-packages.yml') }}

      - name: Restore DeltaTE Apptainer image
        id: restore-deltate-sif
        uses: actions/cache/restore@v4
        with:
          path: .snakemake/ci-deltate-apptainer/1cee6985c43be9e4d154c994b509b2e8.simg
          key: apptainer-sif-v1-${{ runner.os }}-${{ runner.arch }}-apptainer-1.5.3-f7611403ff14417b495ce1806ec88416dd5f6b7cfeb0a8ad4fa6300889265492

      - name: Run DeltaTE container smoke
        env:
          APPTAINER_CACHEDIR: ${{ runner.temp }}/apptainer-cache
          APPTAINER_DISABLE_CACHE: "true"
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          timeout --signal=TERM --kill-after=30s 35m \
            python .github/scripts/deltate_container_smoke.py \
            --workdir "${RUNNER_TEMP}/hribo DeltaTE smoke" \
            --conda-prefix "${GITHUB_WORKSPACE}/.snakemake/ci-deltate-conda" \
            --apptainer-prefix "${GITHUB_WORKSPACE}/.snakemake/ci-deltate-apptainer"

      - name: Record DeltaTE smoke diagnostics
        if: always()
        env:
          SMOKE_WORKDIR: ${{ runner.temp }}/hribo DeltaTE smoke
          SIF_PATH: ${{ github.workspace }}/.snakemake/ci-deltate-apptainer/1cee6985c43be9e4d154c994b509b2e8.simg
        run: |
          mkdir -p "${SMOKE_WORKDIR}/logs"
          {
            apptainer version
            df -h "${RUNNER_TEMP}"
            free -h
            du -sh "${SMOKE_WORKDIR}"
            if test -f "${SIF_PATH}"
            then
              stat --format='SIF bytes: %s' "${SIF_PATH}"
            fi
          } | tee "${SMOKE_WORKDIR}/logs/runtime-diagnostics.txt"
          {
            echo "### DeltaTE container smoke"
            echo "- SIF cache hit: ${{ steps.restore-deltate-sif.outputs.cache-hit }}"
            echo "- Coverage: production input adapters, patched engine, result tables, four-page report, and stable no-op rerun."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save DeltaTE Apptainer image
        if: >-
          success() &&
          steps.restore-deltate-sif.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/development' ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/cache/save@v4
        with:
          path: .snakemake/ci-deltate-apptainer/1cee6985c43be9e4d154c994b509b2e8.simg
          key: apptainer-sif-v1-${{ runner.os }}-${{ runner.arch }}-apptainer-1.5.3-f7611403ff14417b495ce1806ec88416dd5f6b7cfeb0a8ad4fa6300889265492

      - name: Upload DeltaTE smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deltate-container-smoke-logs
          path: |
            ${{ runner.temp }}/hribo DeltaTE smoke/logs
            ${{ runner.temp }}/hribo DeltaTE smoke/.snakemake/log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

