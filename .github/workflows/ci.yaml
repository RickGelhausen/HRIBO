      - name: Restore DeepRibo Apptainer image
        id: restore-deepribo-sif
        uses: actions/cache/restore@v4
        with:
          path: .snakemake/ci-deepribo-apptainer/740097e3e5dad598a6388f394618dcd7.simg
          key: apptainer-sif-v1-${{ runner.os }}-${{ runner.arch }}-apptainer-1.5.3-4c4aef7d7d8eea790c6fcb360f69eda864888ea5effe24492ec88b8ef807a780

      - name: Run DeepRibo container smoke
