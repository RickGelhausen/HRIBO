# Environment for running HRIBO itself. The workflow's own tools are installed
# per rule from workflow/envs, so only Snakemake and its plugins belong here.
#
#   conda env create -f environment.yaml
#   conda activate snakemake
name: snakemake
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.11
  - snakemake >=9.0
  # Only needed to submit to a cluster; harmless otherwise.
  - snakemake-executor-plugin-slurm
  # Used by the test suite, not by the workflow.
  - pytest
