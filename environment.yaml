# Environment for running HRIBO itself. The workflow's scientific tools are
# installed per rule from workflow/envs. This launcher environment also needs
# pandas because the Snakefile reads the sample sheet while constructing the
# DAG, and conda because Snakemake uses it to create those rule environments.
#
#   conda create -n snakemake -f environment.linux-64.pin.txt
#   conda activate snakemake
name: snakemake
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python =3.11
  - snakemake =9.25.2
  - pandas =2.3.3
  - conda =26.7.1
  # Only needed to submit to a cluster; harmless otherwise.
  - snakemake-executor-plugin-slurm =2.8.0
