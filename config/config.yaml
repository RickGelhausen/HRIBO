##########################
# Biological information #
##########################

biologySettings:
  # Adapter sequence used
  adapterS3: "" # 3'
  adapterS5: "" # 5'

  # Adapter paired-end (can be left empty when using only single end)
  adapterP3R1: "" # 3' - Forward (part 1)
  adapterP5R1: "" # 5' - Forward (part 1)

  adapterP3R2: "" # 3' - Reverse (part 2)
  adapterP5R2: "" # 5' - Reverse (part 2)

  # Path to the reference genome file
  genome: "genome.fa"

  # Path to the reference annotation file
  annotation: "annotation.gff"

  # Path to the sample sheet
  samples: "config/samples.tsv"

  # Alternative start codons considered where applicable
  alternativeStartCodons: ["GTG", "TTG"]

#####################
# Analysis settings #
#####################

# Differential Expression analysis
##################################

differentialExpressionSettings:
  # Whether differential expression runs at all is decided by the
  # "differential_expression" stage in workflowSettings.stages below.

  # Feature types from annotation column 3 used for differential expression.
  # Matching is case-sensitive. Missing types are skipped with a warning as long
  # as at least one requested type is present; the run stops if none are present.
  features: ["CDS", "sRNA"]

  # YAML list of condition contrasts (left minus right), for example:
  # contrasts: ["treated1-control1", "treated2-control2"]
  # Leave empty to infer every pairwise contrast among conditions with both
  # RIBO and RNA libraries.
  contrasts: []

  # pvalue adjusted cutoff to be used to prefilter the result tables (default = 0.05)
  padjCutoff: 0.05

  # log2FC used to prefilter result tables. Supply a positive value; the inclusive
  # boundaries are upregulated: >= log2fcCutoff, downregulated: <= -log2fcCutoff.
  log2fcCutoff: 1.0

  # A feature is called detected for one method and condition when at least
  # this many replicates each have both the minimum raw count and CPM. The
  # cross-condition report keeps "not detected" separate from "not tested";
  # these thresholds do not change the differential-expression tests.
  detectionMinCPM: 1
  detectionMinCount: 10
  detectionMinReplicates: 2

  # Number of probability-density bins used by xTail. Larger values improve
  # p-value accuracy at the cost of runtime (xTail's default is 10000).
  xtailBins: 10000

  # Minimum mean RNA and RPF count retained by xTail. Keep the historical
  # HRIBO/xTail 1.1.5 threshold; xTail 1.2.0 otherwise raises this to 10.
  xtailMinMeanCount: 1

# ORF predictions
#################

predictionSettings:
  # DeepRibo predictions: on / off. When enabled, the genome sequence may
  # contain only uppercase A/C/G/T/N because DeepRibo is case-sensitive and
  # cannot encode other IUPAC symbols.
  deepribo: "on"

  # Distance in nucleotides from the 3' end of a read to the ribosomal A-site,
  # used to build the A-site tracks DeepRibo reads.
  #
  # DeepRibo's published value of 12 was derived from E. coli; other organisms,
  # ribosome preparations and nuclease digestion protocols shift the footprint,
  # so check it rather than assuming it transfers.
  #
  # The TIS advisor measures P-site offsets from both 5' and 3' read ends. For
  # RIBO libraries, its report may suggest a separate 3'-to-A-site DeepRibo
  # value when the usable 3' read lengths agree. It does not change this setting
  # automatically. Compare advice across libraries before changing this one
  # global value and rerunning predictions.
  deepriboASiteOffset: 12

# Read Length Statistics
########################

readstatSettings:
  # Read lengths to be considered. Comma seperated string allows intervals denoted by "-" symbol (e.g. "22,23,27,34-35")
  readLengths: "10-80"

# Metagene Profiling
####################

metageneSettings:
  ### Analysis
  # Window on which the metagene profiling is performed
  # Number of nucleotides upstream of each annotated ORF that will be considered
  positionsOutsideORF: 100
  # Number of nucleotides in each annotated ORF that will be considered
  positionsInORF: 150

  # methods to filter the input annotation before metagene profiling is performed (overlap, length and/or rpkm)
  filteringMethods: ["overlap", "length", "rpkm"]

  # Distance around each annotated genes that will be considered for removing overlapping genes
  # neighboringGenesDistance 0 only removes directly overlapping genes.
  neighboringGenesDistance: 50

  # Filter ORFs based on RPKM threshold
  rpkmThreshold: 10.0

  # Minimum length of considered ORFs. ORFs smaller than positionsInORF are filtered automatically.
  lengthCutoff: 50

  # Mapping methods to be considered (fiveprime, threeprime, centered, global)
  mappingMethods: ["fiveprime", "threeprime"]

  # Read lengths to be considered. Comma seperated string allows intervals denoted by "-" symbol (e.g. "22,23,27,34-35")
  readLengths: "25-34"

  # Normalization method (raw, cpm, window)
  # raw: no normalization, raw read counts
  # cpm: counts per million normalization (CPM)
  # window: normalized data by total counts and considered window length.
  normalizationMethods: ["raw", "cpm", "window"]

  ### Plotting
  # Plot output types. Supported (svg, pdf, png, jpg, interactive)
  outputFormats: ["interactive", "svg"]

  # Interactive html files require more space as they require plotly.js integrated, online access or a local copy of plotly.js
  # integrated: integrates plotly.js once into each HTML report (about 4 MB)
  # online: references an online version of plotly.js (files can only be used with active internet connection)
  # local: references a local plotly.js script (requires a local copy of plotly.js to open the plots)
  includePlotlyJS: "integrated"

  # Optional series colors for the per-read-length plots, assigned in read-length
  # order. Short lists cycle; an empty list uses the color-blind-friendly theme.
  colorList: []

# TIS caller advice
##################

tisAdvisorSettings:
  # Whether the advisor runs at all is decided by the "tis_advisor" stage in
  # workflowSettings.stages below. It suggests read lengths and P-site offsets
  # for a TIS caller such as ORFBounder. For RIBO libraries, it may also suggest
  # a DeepRibo A-site offset for manual review.

  # Read lengths examined when looking for an initiation signal. Keep this wider
  # than the metagene readLengths so that a usable length outside the expected
  # range is still found.
  readLengths: "22-40"

  # Read ends to evaluate. Both are analysed by default and the one whose offsets
  # are most consistent across read lengths is recommended, since that is the end
  # the protocol defines precisely. Which end that is varies by organism and
  # nuclease treatment, so it is worth letting the data decide.
  mappingMethods: ["fiveprime", "threeprime"]

#####################
# Workflow Settings #
#####################

workflowSettings:
  # Which parts of the pipeline to run.
  #
  # A stage only says what is asked for, not what is computed: whatever a
  # selected stage depends on is still built, so asking for "predictions" alone
  # also trims, filters, maps and counts reads on the way there. Commenting a
  # line out removes its outputs from the run, which is how a run can stop at,
  # say, the BAM files.
  #
  # Instead of a list, a preset name can be given:
  #   stages: "full"           every stage below, differential expression included
  #   stages: "preprocessing"  trimming, mapping and the MultiQC report
  #
  # A single run can override this without editing the file:
  #   snakemake ... --config stages=mapping,tracks
  stages:
    - trimming                 # mapping-ready trimmed/assembled reads plus FastQC
    - mapping                  # the final alignments in maplink/ with their indices
    - qc                       # the MultiQC report over every quality control step
    - tracks                   # bigwig coverage tracks
    - genome_tracks            # start, stop, alternative start codon and RBS tracks
    - readcounts               # read count and annotation spreadsheets
    - metagene                 # metagene profiles and read length statistics
    - tis_advisor              # read length and P-site offset advice for a TIS caller
    - correlation              # the Spearman correlation heatmap between libraries
    - pca                      # the PCA plot of the read counts
    - predictions              # ORF predictions plus a combined updated annotation
    # - differential_expression  # xTail, RiboRex, deltaTE, a cross-condition
                                 # overview and browser tracks; needs RNA-seq
                                 # libraries and at least two conditions
    - overview                 # the combined overview spreadsheet
  #
  # predictions, differential_expression and overview need Ribo-seq libraries and
  # are skipped when the sample sheet has none.
